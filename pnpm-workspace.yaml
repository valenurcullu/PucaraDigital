  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo-router@58.0.30
  - expo@58.0.23
  - is-core-module@2.18.0
  - next@16.4.5
  - node-forge@1.4.3
  - resolve@1.22.14
nodeLinker: hoisted
saveExact: true
strictPeerDependencies: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  '@expo/cli>glob': 14.0.3

injectWorkspacePackages: true
dedupeInjectedDeps: false
syncInjectedDepsAfterScripts:
  - typecheck

hoistWorkspacePackages: false
